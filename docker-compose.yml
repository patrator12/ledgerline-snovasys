services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      LEDGERLINE_APP_PASSWORD: ${LEDGERLINE_APP_PASSWORD:?Set LEDGERLINE_APP_PASSWORD in .env}
    volumes:
      - ledgerline_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_owner -d ledgerline"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ledgerline_app:${LEDGERLINE_APP_PASSWORD}@db:5432/ledgerline
      MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerline_owner:${DB_OWNER_PASSWORD}@db:5432/ledgerline
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Copy .env.example to .env and set demo passwords}
      SEED_HOLDER_PASSWORD: ${SEED_HOLDER_PASSWORD:?Copy .env.example to .env and set demo passwords}
      SEED_AUDITOR_PASSWORD: ${SEED_AUDITOR_PASSWORD:?Copy .env.example to .env and set demo passwords}
    command: ["sh", "-c", "python -m app.init_db && python -m app.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: ledgerline_test
      POSTGRES_USER: ledgerline_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_test -d ledgerline_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    build: .
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://ledgerline_test:${TEST_DB_PASSWORD}@test-db:5432/ledgerline_test
      TEST_DATABASE_URL: postgresql+psycopg://ledgerline_test:${TEST_DB_PASSWORD}@test-db:5432/ledgerline_test
    command: ["python", "-m", "pytest", "-q", "tests"]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  ledgerline_data:
