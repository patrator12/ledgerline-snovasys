services:
  - type: web
    name: ledgerline-snovasys
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SIGNING_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_HOLDER_PASSWORD
        sync: false
      - key: SEED_AUDITOR_PASSWORD
        sync: false
