{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login-shell">
  <div class="login-brand"><span class="brand-mark">L</span><span>LedgerLine</span></div>
  <div class="login-panel">
    <h1>Sign in</h1>
    <p class="muted">Secure access to your money movement ledger.</p>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack-form">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Username<input name="username" autocomplete="username" required maxlength="80"></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button primary full" type="submit">Continue <span>→</span></button>
    </form>
    <p class="login-foot">Every movement is recorded. Every balance is checked.</p>
  </div>
</section>
{% endblock %}
