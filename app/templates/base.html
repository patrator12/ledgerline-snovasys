<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="LedgerLine account balances, money movement, and audit history.">
  <title>{% block title %}LedgerLine{% endblock %} · LedgerLine</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
{% if user %}
  <aside class="rail">
    <a class="brand" href="/dashboard" aria-label="LedgerLine overview"><span class="brand-mark">L</span><span>LedgerLine</span></a>
    <nav aria-label="Main navigation">
      <a class="nav-link{% if request.url.path == '/dashboard' %} active{% endif %}" href="/dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span>Overview</span></a>
      <a class="nav-link" href="/dashboard#accounts"><span class="nav-icon" aria-hidden="true">▤</span><span>Accounts</span></a>
      <a class="nav-link" href="/dashboard#activity"><span class="nav-icon" aria-hidden="true">↔</span><span>Activity</span></a>
      {% if user.role in ['admin','auditor'] %}<a class="nav-link{% if request.url.path == '/audit' %} active{% endif %}" href="/audit"><span class="nav-icon" aria-hidden="true">◇</span><span>Audit log</span></a>{% else %}<a class="nav-link" href="/dashboard#audit"><span class="nav-icon" aria-hidden="true">◇</span><span>Audit</span></a>{% endif %}
    </nav>
    <div class="rail-bottom">
      <div class="user-chip"><span class="user-dot">{{ user.username[:1]|upper }}</span><div><strong>{{ user.username }}</strong><small>{{ user.role|title }}</small></div></div>
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ session.csrf_token }}"><button class="logout" type="submit">Sign out <span>↗</span></button></form>
    </div>
  </aside>
{% endif %}
<main class="page {% if not user %}page-auth{% endif %}">
  {% block content %}{% endblock %}
</main>
</body>
</html>
